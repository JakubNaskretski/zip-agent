[project]
name = "librarian"
version = "0.1.0"
description = "Governed, transactional knowledge-base engine for the living-memory agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Runtime is stdlib-only (dependencies = []). These are DEV/TEST-only: PyYAML +
# python-pptx + Pillow let the suite exercise the on-demand pptx-draft skill end to
# end (the vendored reader.py read/validate verbs need PyYAML; render.py needs
# python-pptx; Pillow only if a raster asset is spliced). In the deployed sandbox
# they ship as offline wheels via `build_memory.py --pptx`, never as engine deps.
dev = ["pytest>=8", "PyYAML>=6", "python-pptx>=1.0", "Pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["librarian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
