[project]
name = "librarian"
version = "0.1.0"
description = "Governed, transactional knowledge-base engine for the living-memory agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Runtime is stdlib-only (dependencies = []). These are DEV/TEST-only: PyYAML and
# python-pptx let the test suite exercise the on-demand pptx-draft skill end to
# end (the vendored reader.py read verbs need PyYAML; compose-v5 needs
# python-pptx). In the deployed sandbox they ship as offline wheels via
# `build_memory.py --pptx`, never as a runtime dependency of the engine.
dev = ["pytest>=8", "PyYAML>=6", "python-pptx>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["librarian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
